name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Xio.Parallax.Client.slnx
      - run: dotnet build Xio.Parallax.Client.slnx -c Release --no-restore
      - run: dotnet format Xio.Parallax.Client.slnx --verify-no-changes --no-restore
      - run: dotnet test Xio.Parallax.Client.slnx -c Release --no-build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check python examples/python
      - run: uv run pytest

  regenerated:
    # The committed generated code must be exactly what the pinned document produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v5
      - name: Install the Kiota version the lock file names
        run: |
          version=$(python3 scripts/kiota-version.py)
          dotnet tool install --global Microsoft.OpenApi.Kiota --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: sh scripts/generate.sh
      - run: git diff --exit-code -- src/Xio.Parallax.Client/Generated python/xio_parallax_client/generated

  live:
    # Token-less smoke of the live API: it is up, and it still serves the document.
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://api.parallax.xiobjects.com/health
      - run: curl -fsS -o /dev/null https://api.parallax.xiobjects.com/openapi/v1.json
